id = "carbon.rust"
name = "Rust"
version = "0.1.0"
schema_version = 1
carbon_api = ">=0.1, <0.2"
description = "Rust colours and the rust-analyzer language server."
authors = ["Carbon"]
repository = "https://github.com/denizhoroz/carbon"
categories = ["language"]
capabilities = ["process.exec:rust-analyzer", "net:github.com"]

[[languages]]
id = "rust"
name = "Rust"
suffixes = ["rs"]
grammar = "rust"
line_comment = "//"

[[grammars]]
name = "rust"
wasm = "grammars/rust.wasm"
highlights = "grammars/rust/highlights.scm"
injections = "grammars/rust/injections.scm"

[[language_servers]]
id = "rust-analyzer"
name = "rust-analyzer"
languages = ["rust"]
command = "rust-analyzer"
install_hint = "rustup component add rust-analyzer"

# Used when rust-analyzer is not on PATH (rustup's copy is), after the user agrees.
[language_servers.download.windows-x64]
url = "https://github.com/rust-lang/rust-analyzer/releases/download/2026-10-19/rust-analyzer-x86_64-pc-windows-msvc.zip"
sha256 = "7df6e1a2595d1906e8441cb83fd58170b47d32eb09bc52c1b2184538cfd49a71"
version = "2026-10-19"
archive = "zip"
bin = "rust-analyzer.exe"

